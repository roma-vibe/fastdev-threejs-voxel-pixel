services:
  app:
    build:
      context: .
      target: production
      args:
        APP_NAME: ${APP_NAME:-Voxel Game}
        APP_SLUG: ${APP_SLUG:-voxel-game}
    ports:
      - '${WEB_PORT:-5173}:5173'
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    ports:
      - '${WEB_PORT:-5173}:${WEB_PORT:-5173}'
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true
    command: npm run dev -- --host 0.0.0.0
volumes:
  node_modules:
